<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Froyo Diaries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#0d3b56;--accent:#29a8e0;--bg:#f0f4f8;--white:#fff;--border:#dce6ee;--text:#1a2e3b;--text-light:#5a7a8a;--red:#ef4444;--radius:12px;--font-display:'Cormorant Garamond',serif;--font-body:'Inter',sans-serif}
body{font-family:var(--font-body);background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.login-card{background:var(--white);border:1px solid var(--border);border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:400px;box-shadow:0 8px 40px rgba(13,59,86,.12)}
.login-brand{text-align:center;margin-bottom:2rem}
.login-brand__icon{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#eef8fd,#d0eef8);border:1.5px solid var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent);margin:0 auto .75rem}
.login-brand__name{font-family:var(--font-display);font-size:1.75rem;font-style:italic;color:var(--dark)}
.login-brand__sub{font-size:.75rem;color:var(--text-light);letter-spacing:.08em;text-transform:uppercase;margin-top:.2rem}
.form-group{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem}
.form-group label{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-light)}
.form-group input{padding:.72rem 1rem;border:1.5px solid var(--border);border-radius:var(--radius);font-family:var(--font-body);font-size:.92rem;color:var(--text);background:#fafcfe;transition:border-color .2s,box-shadow .2s}
.form-group input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(41,168,224,.12);background:#fff}
.btn-login{width:100%;padding:.8rem;background:var(--dark);color:#fff;border:none;border-radius:var(--radius);font-family:var(--font-body);font-size:.9rem;font-weight:600;letter-spacing:.04em;cursor:pointer;margin-top:.5rem;transition:background .2s}
.btn-login:hover{background:var(--accent)}
.error{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);color:#b91c1c;border-radius:var(--radius);padding:.7rem 1rem;font-size:.84rem;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.back-link{text-align:center;margin-top:1.25rem;font-size:.8rem;color:var(--text-light)}
.back-link a{color:var(--accent);font-weight:500}
.back-link a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-brand">
    <div class="login-brand__icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div class="login-brand__name">Froyo Diaries</div>
    <div class="login-brand__sub">Admin Dashboard</div>
  </div>

  {% if error %}
    <div class="error">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ error }}
    </div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-login">Sign In to Dashboard</button>
  </form>

  <div class="back-link">
    <a href="/">← Back to website</a>
  </div>
</div>
</body>
</html>
